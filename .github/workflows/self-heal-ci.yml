name: 'AutoHeal-CI Self-Healing Pipeline'

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test-and-heal:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Test Suite
        id: run-tests
        run: |
          pytest -v

      - name: AutoHeal-CI Autonomous Healing Step
        if: failure()
        uses: ./
        with:
          api_key: ${{ secrets.OPENAI_API_KEY }}
          model: 'gpt-4o'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          max_rounds: '3'
          create_pr: 'true'
